runner_name: vinod

dataset_path: data_loading/pilot_dataset/pilot_dataset_v1.jsonl
dataset_version: pilot_dataset_v1

prompt_template_id: riddle_basic
prompt_template_version: v2
prompt_language: eng
riddle_language_presented: source
is_hint_provided: false

reasoning_mode: high
search_enabled: false
response_format: json
batch_mode: false

# Temperature intentionally omitted: rely on model default for reasoning runs.
temperature: null
max_output_tokens: 128
seed: null

# Example: pass top_p through without needing a new framework field.
model_params:
  top_p: 0.95

cache_enabled: true
cache_backend: cachesaver
cache_namespace: multicultural_riddles/pilot_dataset_v1/openai_gpt55_high/source_no_hint/v2
cache_dir: .cache/cachesaver

api_key_env_var: OPENAI_API_KEY
base_url: null

runner_version: v1.0.0
notes: openai baseline with CacheSaver
strict_capability_check: true

# NOTE: provider_model_name is a placeholder. Replace with a real OpenAI
# model string your team has API access to before running.
model_spec:
  model_name: GPT5.5-high
  model_id: openai/gpt-5.5-high
  provider: openai
  access_pattern: direct_api
  provider_model_name: gpt-5.5-high
  closed_source: true
  notes: OpenAI reasoning-heavy model
  capabilities:
    supports_reasoning: true
    supports_search: false
    supports_structured_output: true
    supports_batch: false
    supports_seed: true
